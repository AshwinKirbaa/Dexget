[workspace]
members = ["crates/dexget-core", "crates/dexget-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

